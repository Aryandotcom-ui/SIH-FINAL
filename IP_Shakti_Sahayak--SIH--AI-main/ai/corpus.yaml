      priority: medium

  - file: geographical-indications-act-1999.pdf
    status: ingested
    jurisdiction: india
    instrument_type: statute
    act_name: "The Geographical Indications of Goods (Registration and Protection) Act, 1999"
    effective_date: "2003-09-15"
    source_url: ""
    acquisition:
      where: "India Code (indiacode.nic.in)"
      note: >-
        GI is a live route for regional Ayurvedic products and is often the
        right answer for an applicant barred under section 3(p). Worth having
        before the system can only ever say no.
      priority: medium

  # -------------------------------------------------------------------------
  # Held and ingested, but not cited by the knowledge graph (yet).
  #
  # These were absent from the manifest entirely, which meant they ran on
  # inferred metadata — and inference is where every corpus defect found so
  # far has come from: the Trade Marks scan took its act_name from a 1999
  # Acrobat Distiller title field ("Book Rajpatra") and its effective_date
  # from today's clock. An entry here costs nothing and stops the guessing.
  # -------------------------------------------------------------------------
  - file: trade-marks-act-1999.pdf
    status: ingested
    jurisdiction: india
    instrument_type: statute
    act_name: "The Trade Marks Act, 1999"
    effective_date: "2003-09-15"
    source_url: ""
    acquisition:
      where: "India Code (indiacode.nic.in)"
      note: >-
        A Gazette of India scan, not an India Code text: two pages are
        image-only and section detection is materially worse than on the
        other statutes (53 distinct labels for an Act with far more
        sections). Prefer the India Code version when one can be obtained.
        VERIFY the commencement date above — 15 September 2003 is the date
        commonly given for this Act coming into force, but it is not stated
        in this scan.
      priority: medium

  - file: ayush-examination-guidelines-2025.pdf
    status: ingested
    jurisdiction: india
    instrument_type: guideline
    act_name: "Guidelines for Examination of Ayush Related Inventions, 2025"
    effective_date: "2025-01-01"
    source_url: "https://ipindia.gov.in"
    acquisition:
      where: "Office of the Controller General of Patents, Designs and Trade Marks"
      note: >-
        The examiner-facing practice guidance for exactly this domain, so it
        answers "how will the office actually treat my application" in a way
        the bare statute cannot. It is guidance, not law: instrument_type is
        `guideline` so an answer never presents it with the force of a
        section. VERIFY the effective date — the cover carries only the year
        2025, so the value above is the year with a placeholder day.
      priority: high

  - file: paris-convention-1883.pdf
    status: ingested
    jurisdiction: international
    instrument_type: treaty
    act_name: "Paris Convention for the Protection of Industrial Property"
    effective_date: "1998-12-07"
    source_url: ""
    acquisition:
      where: "WIPO (wipo.int/treaties)"
      note: >-
        act_name matches ai/patent_prep/deadlines.yaml's convention_priority
        rule exactly, which is what makes that rule's 12-month Article 4C(1)
        deadline citable rather than merely asserted. The date above is
        India's accession (7 December 1998) rather than the 1883 signature
        or a revision date, because the as-of filter answers "was this
        binding on this applicant", and jurisdiction is set explicitly here
        because inference read this document as `india`.
      priority: medium

  - file: patent-cooperation-treaty-1970.pdf
    status: ingested
    jurisdiction: international
    instrument_type: treaty
    act_name: "Patent Cooperation Treaty"
    effective_date: "1998-12-07"
    source_url: ""
    acquisition:
      where: "WIPO (wipo.int/treaties)"
      note: >-
        Done at Washington 19 June 1970, amended 1979, modified 1984 and
        2001, per the document's own title page. The date above is India's
        accession, for the same reason as the Paris Convention entry.
        act_name matches deadlines.yaml's pct_national_phase rule.
      priority: medium

  - file: pct-regulations-2026.pdf
    status: ingested
    jurisdiction: international
    instrument_type: treaty
    act_name: "Regulations under the Patent Cooperation Treaty"
    effective_date: "2026-01-01"
    source_url: ""
    acquisition:
      where: "WIPO (wipo.int/pct/en/texts)"
      note: >-
        The document states "as in force from January 1, 2026" on its title
        page, which is where the effective_date above comes from — read off
        the instrument rather than inferred. Distinct from the PCT treaty
        text: the Regulations carry the time limits, and Rule 159 is what
        pct_national_phase actually turns on.
      priority: medium
