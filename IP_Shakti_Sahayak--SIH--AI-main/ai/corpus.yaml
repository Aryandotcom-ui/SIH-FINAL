  # -------------------------------------------------------------------------
  # Cited by the knowledge graph. All ingested except where marked pending.
  # The acquisition notes are kept after ingest: they record what the document
  # was supposed to be, which is what a later reader needs to check it against.
  # -------------------------------------------------------------------------
  - file: biological-diversity-act-2002.pdf
    status: ingested
    jurisdiction: india
    instrument_type: statute
    act_name: "The Biological Diversity Act, 2002"
    effective_date: "2003-10-01"
    source_url: ""
    acquisition:
      where: "India Code (indiacode.nic.in) — search 'Biological Diversity Act 2002'"
      note: >-
        Obtain the AS-AMENDED consolidated text incorporating the Biological
        Diversity (Amendment) Act, 2023 (No. 10 of 2023). The bare 2002 text
        states the pre-amendment section 6 rule (NBA approval before FILING),
        which the 2023 amendment replaced with approval before GRANT.
        Ingesting the unamended text will make the system tell applicants
        they are in breach when they are not.
      priority: critical
    section_effective_dates:
      "Section 3": "2023-08-01"
      "Section 6": "2023-08-01"
      "Section 6(1A)": "2023-08-01"
      "Section 6(1B)": "2023-08-01"
      "Section 7": "2023-08-01"
      "Section 40": "2023-08-01"

  - file: biological-diversity-amendment-act-2023.pdf
    status: ingested
    jurisdiction: india
    instrument_type: statute
    act_name: "The Biological Diversity (Amendment) Act, 2023"
    effective_date: "2023-08-01"
    source_url: "https://egazette.gov.in/WriteReadData/2023/247815.pdf"
    acquisition:
      where: "Gazette of India (URL above — verify before relying on it)"
      note: >-
        The amending Act itself. Worth ingesting alongside the consolidated
        text so the system can answer "what changed and when", which is the
        question most applicants who half-remember the old rule are actually
        asking.
      priority: high

  - file: biological-diversity-rules-2024.pdf
    status: ingested
    jurisdiction: india
    instrument_type: rule
    act_name: "The Biological Diversity Rules, 2024"
    effective_date: "2024-10-22"
    source_url: ""
    acquisition:
      where: "National Biodiversity Authority (nbaindia.org) or Gazette of India"
      note: >-
        Rule 16 carries the section 6 procedure: Form 7, the fee, and the
        45-day post-grant notification the graph encodes. Verify the
        commencement date above against the gazette notification before
        ingesting — it drives the as-of filter.
      priority: critical

  - file: drugs-and-cosmetics-act-1940.pdf
    status: ingested
    jurisdiction: india
    instrument_type: statute
    act_name: "The Drugs and Cosmetics Act, 1940"
    effective_date: "1940-04-10"
    source_url: ""
    acquisition:
      where: "India Code (indiacode.nic.in)"
      note: >-
        Chapter IVA (sections 33B–33-I) is the ASU&H part that matters here;
        section 33EEC is cited by the graph. The Act is long and mostly
        irrelevant to Ayurveda IP — consider ingesting Chapter IVA only, and
        record that scoping decision here rather than letting a future reader
        assume the whole Act is searchable.
      priority: high

  - file: drugs-and-cosmetics-rules-1945.pdf
    status: ingested
    jurisdiction: india
    instrument_type: rule
    act_name: "The Drugs and Cosmetics Rules, 1945"
    effective_date: "1945-12-21"
    source_url: ""
    acquisition:
      where: "CDSCO (cdsco.gov.in)"
      note: >-
        Appendix I-B holds the phytopharmaceutical data requirements. Rule
        153 and Schedule T (GMP for ASU drugs) are the other parts worth
        having.
      priority: medium

  - file: fssai-ayurveda-aahar-regulations-2022.pdf
    status: ingested
    jurisdiction: india
    instrument_type: rule
    act_name: "Food Safety and Standards (Ayurveda Aahar) Regulations, 2022"
    effective_date: "2022-07-27"
    source_url: ""
    acquisition:
      where: "FSSAI (fssai.gov.in) — Regulations / Gazette notifications"
      note: >-
        Verify the commencement date; these were notified and brought into
