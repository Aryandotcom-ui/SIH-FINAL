# IP-SAKTI corpus manifest.
#
# One entry per PDF. Fields here override anything the pipeline would
# infer. Everything not listed is inferred and logged as such — run with
# --strict once the corpus is stable so nothing is ever guessed again.
#
# section_effective_dates records amendments: the parent Act commenced in
# 1972, but s.3(d) only exists in its current form from 2005. Without
# this, the as-of filter serves the wrong law.
#
# ---------------------------------------------------------------------------
# ACT NAMES ARE A CONTRACT
# ---------------------------------------------------------------------------
# `act_name` is matched EXACTLY by Chroma's metadata filter and by
# ai/knowledge_graph/ontology.yaml, which cites these strings as the legal
# basis of every obligation. A one-character difference — a missing "The ",
# a comma — silently breaks the pre-filter and makes an obligation
# uncitable. `check_corpus.py` fails loudly on that drift instead of
# leaving you to notice it in a demo.
#
# ---------------------------------------------------------------------------
# `status`
# ---------------------------------------------------------------------------
#   ingested — the PDF is on disk and has been through the pipeline
#   pending  — the graph cites this instrument but we do not have the source
#
# Entries marked `pending` are inert: load_manifest() keys by filename and
# the pipeline only looks up files it actually finds, so listing a document
# we do not yet have costs nothing and keeps the acquisition list in the
# same place as the names it has to match. An obligation citing a `pending`
# instrument still fires — the duty exists in law whether or not we hold the
# PDF — but it is reported as uncitable rather than being quietly dropped.
#
# ---------------------------------------------------------------------------
# `access`
# ---------------------------------------------------------------------------
#   public   — (default, if omitted) freely republishable government/treaty
#              text; citing it needs no consent from the requester
#   licensed — under terms that restrict republication (a paid reporter
#              series, a subscription database); ai/audit.py withholds any
#              citation to a `licensed` act unless the API request carried
#              consent for that query, and logs whether consent was given
#              either way. Every document currently listed is a public
#              government or treaty text, so no entry below sets this.
#
# See ai/audit.py for the consent-gating and audit-trail mechanism this
# field feeds.

documents:
  # -------------------------------------------------------------------------
  # Ingested
  # -------------------------------------------------------------------------
  - file: patents-act-1970.pdf
