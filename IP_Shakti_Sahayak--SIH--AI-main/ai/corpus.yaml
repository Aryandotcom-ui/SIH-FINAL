      priority: medium

  - file: cosmetics-rules-2020.pdf
    status: ingested
    jurisdiction: india
    instrument_type: rule
    act_name: "The Cosmetics Rules, 2020"
    effective_date: "2020-12-15"
    source_url: ""
    acquisition:
      where: "CDSCO (cdsco.gov.in)"
