# CI for IP-SAKTI Sahayak.
#
# Three things are checked, in rough order of how expensive the bug they
# catch is to find any other way:
#
#   1. corpus integrity — act_name is an exact-match contract between
#      ai/corpus.yaml and ai/knowledge_graph/ontology.yaml. A one-character
#      difference makes an obligation uncitable at runtime and looks exactly
#      like "there is no law about this", which is invisible in a demo. See
#      ai/knowledge_graph/check.py, whose own docstring asks for this.
#   2. the Python suite.
#   3. the frontend actually builds.
#
# The eval suite is deliberately not run here: it needs an ingested corpus
# and, for the generation half, an API key. It is a scored benchmark to run
# deliberately, not a gate on every push.

name: CI

# Pushes to a branch with an open PR are covered by the pull_request event,
# so listening to both here ran every commit twice on the same SHA. The
# default branch keeps its own push trigger because nothing opens a PR
# against it.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR makes the in-flight run obsolete. Keyed on the PR
# number rather than github.ref, which differs between the push and
# pull_request events for the same commit and so deduplicated nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: IP_Shakti_Sahayak--SIH--AI-main

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: IP_Shakti_Sahayak--SIH--AI-main/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Corpus / ontology integrity
        # Exit 1 means an act is cited by the graph but not ingested yet,
        # which is a normal state during build-out. Exit 2 means the two
        # files disagree on an act_name — a typo that silently breaks
        # retrieval — and that fails the build.
        run: |
          set +e
          python -m ai.knowledge_graph.check
          status=$?
          set -e
          if [ "$status" -ge 2 ]; then
            echo "::error::corpus.yaml and ontology.yaml disagree on an act_name"
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            echo "::notice::some cited acts are not ingested yet (expected during build-out)"
          fi

      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: IP_Shakti_Sahayak--SIH--AI-main/frontend/package-lock.json

      - name: Install
        working-directory: IP_Shakti_Sahayak--SIH--AI-main/frontend
        run: npm ci

      - name: Build
        working-directory: IP_Shakti_Sahayak--SIH--AI-main/frontend
        run: npm run build
